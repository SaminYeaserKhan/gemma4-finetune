e the answer that<br />appeared most often</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-GATE-2" data-look="neo" transform="translate(240.1796875, 965.796875)"><rect class="basic label-container" style="" x="-123.1796875" y="-72" width="246.359375" height="144"/><g class="label" style="" transform="translate(-107.1796875, -60)"><rect/><foreignObject width="214.359375" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>Escalation gate</b><br />rank by how much the<br />3 answers disagree;<br />break ties by confidence</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-CHECK-7" data-look="neo" transform="translate(381.07421875, 171)"><rect class="basic label-container" style="" x="-167.6875" y="-72" width="335.375" height="144"/><g class="label" style="" transform="translate(-151.6875, -60)"><rect/><foreignObject width="303.375" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>Checker</b><br />Qwen3.5-9B, 4-bit<br />sees the question and the working<br /><b>never sees the correct answer</b></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-OUT-13" data-look="neo" transform="translate(521.96875, 1167.421875)"><rect class="basic label-container" style="fill:#86e5a1 !important;stroke:#009d25 !important;stroke-width:2px !important" x="-160.8203125" y="-42" width="321.640625" height="84"/><g class="label" style="" transform="translate(-144.8203125, -30)"><rect/><foreignObject width="289.640625" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>Answer sh