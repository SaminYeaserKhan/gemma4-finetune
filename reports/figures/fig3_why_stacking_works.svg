w.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Which kind of<br />mistake was it?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A-3" data-look="classic" transform="translate(794.8359375, 71)"><rect class="basic label-container" style="" x="-111.015625" y="-39" width="222.03125" height="78"/><g class="label" style="" transform="translate(-81.015625, -24)"><rect/><foreignObject width="162.03125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Its other two attempts<br />got it right</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B-5" data-look="classic" transform="translate(794.8359375, 247)"><rect class="basic label-container" style="" x="-116.2578125" y="-39" width="232.515625" height="78"/><g class="label" style="" transform="translate(-86.2578125, -24)"><rect/><foreignObject width="172.515625" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>All three attempts were<br />wrong in the same way</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-AV-7" data-look="classic" transform="translate(1091.09375, 71)"><rect class="basic label-container" style="fill:#e8f4ea !important;stroke:#2d6a4f !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>Keeping the most common answer<br />already fixes this</b><br />and it costs nothing</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-BV-9" data-look="classic" transform="translate(1091.09375, 247)"><rect class="basic label-container" style="fill:#fdf0e6 !important;stroke:#b5651d !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>Only an outside opinion fixes this</b><br />something has to point out<br />the misunderstanding</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-11" data-look="classic" transform="translate(1401.09375, 159)"><rect class="basic label-container" style="fill:#e6eefc !important;stroke:#2b4c8c !important;stroke-width:2px !important" x="-130" y="-147" width="260" height="294"/><g class="label" style="" transform="translate(-100, -132)"><rect/><foreignObject width="200" height="264"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>So do both, in this order</b><br />keep the most common answer first,<br />and only ask for help on the<br />questions where all three disagreed<br /><br /><b>59.4% → 62.6% correct,</b><br />with no extra internet use at all</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>