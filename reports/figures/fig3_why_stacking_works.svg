88.765625, -38.25)"><foreignObject width="177.53125" height="76.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>It does know how to do<br />this. It was just careless<br />on this attempt.</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(582.9921875, 464.828125)"><g class="label" data-id="L_T_B_0" transform="translate(-98.890625, -38.25)"><foreignObject width="197.78125" height="76.5"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>It misunderstood what the<br />question was asking, and<br />would do so every time.</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-W-0" data-look="neo" transform="translate(387.03125, 69)"><rect class="basic label-container" style="" x="-100.828125" y="-57" width="201.65625" height="114"/><g class="label" style="" transform="translate(-84.828125, -45)"><rect/><foreignObject width="169.65625" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>The small AI got<br />a question wrong.</b><br />Why?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T-1" data-look="neo" transform="translate(387.03125, 276.2890625)"><polygon points="110.2890625,0 220.578125,-110.2890625 110.2890625,-220.578125 0,-110.2890625" class="label-container" transform="translate(-109.7890625, 110.2890625)"/><g class="label" style="" transform="translate(-66.2890625, -30)"><rect/><foreignObject width="132.578125" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>Which kind of<br />mistake was it?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-A-3" data-look="neo" transform="translate(190.9609375, 585.078125)"><rect class="basic label-container" style="" x="-113.8203125" y="-42" width="227.640625" height="84"/><g class="label" style="" transform="translate(-97.8203125, -30)"><rect/><foreignObject width="195.640625" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>Its other two attempts<br />got it right</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-B-5" data-look="neo" transform="translate(583.1015625, 585.078125)"><rect class="basic label-container" style="" x="-118.8828125" y="-42" width="237.765625" height="84"/><g class="label" style="" transform="translate(-102.8828125, -30)"><rect/><foreignObject width="205.765625" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p>All three attempts were<br />wrong in the same way</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-AV-7" data-look="neo" transform="translate(190.9609375, 724.078125)"><rect class="basic label-container" style="fill:#eaf7ff !important;stroke:#46bbfe !important" x="-178.9609375" y="-57" width="357.921875" height="114"/><g class="label" style="" transform="translate(-162.9609375, -45)"><rect/><foreignObject width="325.921875" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>Keeping the most common answer<br />already fixes this</b><br />and it costs nothing</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-BV-9" data-look="neo" transform="translate(583.1015625, 724.078125)"><rect class="basic label-container" style="fill:#fff2e3 !important;stroke:#f0a04b !important" x="-173.1796875" y="-57" width="346.359375" height="114"/><g class="label" style="" transform="translate(-157.1796875, -45)"><rect/><foreignObject width="314.359375" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>Only an outside opinion fixes this</b><br />something has to point out<br />the misunderstanding</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R-11" data-look="neo" transform="translate(387.03125, 938.078125)"><rect class="basic label-container" style="fill:#86e5a1 !important;stroke:#009d25 !important;stroke-width:2px !important" x="-176.3671875" y="-117" width="352.734375" height="234"/><g class="label" style="" transform="translate(-160.3671875, -105)"><rect/><foreignObject width="320.734375" height="210"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>So do both, in this order</b><br />keep the most common answer first,<br />and only ask for help on the<br />questions where all three disagreed<br /><br /><b>59.4% → 62.6% correct,</b><br />with no extra internet use at all</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>