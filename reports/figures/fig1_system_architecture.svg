 data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M735.5,467L735.5,473.167C735.5,479.333,735.5,491.667,735.5,504C735.5,516.333,735.5,528.667,735.5,541C735.5,553.333,735.5,565.667,735.5,587.333C735.5,609,735.5,640,735.5,655.5L735.5,671" id="my-svg-L_VOTE_OUT_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_VOTE_OUT_0" data-points="W3sieCI6NzM1LjUsInkiOjQ2N30seyJ4Ijo3MzUuNSwieSI6NTA0fSx7IngiOjczNS41LCJ5Ijo1NDF9LHsieCI6NzM1LjUsInkiOjU3OH0seyJ4Ijo3MzUuNSwieSI6Njc1fV0=" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_SOLVER_VOTE_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_SOLVER_GATE_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(173, 541)"><g class="label" data-id="L_GATE_CHECK_0" transform="translate(-97.234375, -12)"><foreignObject width="194.46875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>only the ones it found hard</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(438, 380)"><g class="label" data-id="L_CHECK_SOLVER_0" transform="translate(-100, -48)"><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>a yes or no, plus one sentence<br />saying where it went wrong<br />(never the answer itself)</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_VOTE_OUT_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-SOLVER-0" data-look="classic" transform="translate(438, 132)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>The small AI</b><br />We taught it using 7,500 school maths problems.<br />It is squeezed down to fit on ordinary hardware,<br />and it writes every answer you ever see.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-VOTE-1" data-look="classic" transform="translate(735.5, 380)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>Compare its three attempts</b><br />If two or three attempts landed on the<br />same answer, that is the answer we keep.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-GATE-2" data-look="classic" transform="translate(173, 380)"><rect class="basic label-container" style="" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>Decide: does this one need help?</b><br />Only if all three attempts disagree.<br />Those are the questions it clearly<br />found hard.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-CHECK-7" data-look="classic" transform="translate(305.5, 738)"><rect class="basic label-container" style="" x="-130" y="-135" width="260" height="270"/><g class="label" style="" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>A bigger AI, acting as a marker</b><br />It reads the question and the small AI's working,<br />then says whether the working looks right.<br /><b>It is never shown the correct answer</b><br />and it is never asked to answer the question.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-OUT-13" data-look="classic" transform="translate(735.5, 738)"><rect class="basic label-container" style="fill:#e6eefc !important;stroke:#2b4c8c !important;stroke-width:2px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>The answer you see</b><br />always written by the small AI<br />on your own machine</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>