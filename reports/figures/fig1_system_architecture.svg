ss flowchart-v2" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_flowchart-v2-crossStart-margin" class="marker cross flowchart-v2" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"><g class="cluster" id="my-svg-OFF" data-look="classic"><rect style="fill:#fdf0e6 !important;stroke:#b5651d !important;stroke-width:2px !important" x="23.140625" y="578" width="554.71875" height="320"/><g class="cluster-label" transform="translate(27.140625, 578)"><foreignObject width="546.71875" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>THIS PART IS NOT ON YOUR MACHINE (contacted for about 3 questions in 10)</p></span></div></foreignObject></g></g><g class="cluster" id="my-svg-DEV" data-look="classic"><rect style="fill:#e8f4ea !important;stroke:#2d6a4f !important;stroke-width:2px !important" x="8" y="8" width="892.5" height="496"/><g class="cluster-label" transform="translate(140.09375, 8)"><foreignObject width="628.3125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>EVERYTHING HERE RUNS ON YOUR OWN MACHINE (an old laptop, an office PC, a phone)</p></span></div></foreignObject></g></g></g><g class="edgePaths"><path d="M568,186.185L595.917,197.821C623.833,209.457,679.667,232.728,707.583,249.864C735.5,267,735.5,278,735.5,283.5L735.5,289" id="my-svg-L_SOLVER_VOTE_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" sty