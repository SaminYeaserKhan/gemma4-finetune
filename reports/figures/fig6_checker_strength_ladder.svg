nce only</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-L1-0" data-look="neo" transform="translate(165.890625, 114)"><rect class="basic label-container" style="" x="-138.9296875" y="-102" width="277.859375" height="204"/><g class="label" style="" transform="translate(-122.9296875, -90)"><rect/><foreignObject width="245.859375" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>The small AI marking<br />its own work</b><br />Catches only 22 of every<br />100 wrong answers.<br />It approves almost anything<br />it wrote itself.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L2-1" data-look="neo" transform="translate(165.890625, 468.5)"><rect class="basic label-container" style="fill:#eaf7ff !important;stroke:#46bbfe !important;stroke-width:2px !important" x="-140.4921875" y="-147" width="280.984375" height="294"/><g class="label" style="" transform="translate(-124.4921875, -135)"><rect/><foreignObject width="248.984375" height="270"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>A medium AI as marker</b><br />(9 billion)<br />Catches 89 of every 100<br />wrong answers.<br />But wrongly fails 19 of every<br />100 answers that were right.<br /><br /><b>BEST OVERALL</b><br />and nearly twice as fast</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L3-2" data-look="neo" transform="translate(165.890625, 838)"><rect class="basic label-container" style="fill:#ffd9d4 !important;stroke:#e06a5a !important" x="-153.890625" y="-117" width="307.78125" height="234"/><g class="label" style="" transform="translate(-137.890625, -105)"><rect/><foreignObject width="275.78125" height="210"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>A large AI as marker</b><br />(30 billion)<br />Catches a few more errors,<br />but wrongly fails <b>26</b> of every<br />100 answers that were right.<br /><br /><b>WORSE, despite being bigger</b></p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L4-3" data-look="neo" transform="translate(165.890625, 1162.5)"><rect class="basic label-container" style="fill:#f2f2f2 !important;stroke:#9a9a9a !important;stroke-dasharray:4 4 !important" x="-131.0625" y="-102" width="262.125" height="204"/><g class="label" style="" transform="translate(-115.0625, -90)"><rect/><foreignObject width="230.125" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 520px; text-align: center;"><span class="nodeLabel"><p><b>A perfect marker</b><br />one that is simply shown<br />the answer key.<br />Not a real option — it just<br />shows the best score<br />anyone could ever reach.</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>